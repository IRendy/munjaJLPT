[package]
name = "munja"
version = "0.0.1"
edition = "2021"
description = "整理 JLPT（日语能力考试）试题：JSON → HTML / Markdown / PDF（无头浏览器打印）"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
lto = true
strip = true
